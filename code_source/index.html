    <!-- Debug script to help troubleshoot AR issues -->
    <script>
      // WebGL Detection and Browser Info
      function checkWebGLSupport() {
        console.log('=== WebGL & Browser Compatibility Check ===');
        console.log('User Agent:', navigator.userAgent);
        console.log('Browser:', getBrowserName());
        
        // Check WebGL support
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        
        if (gl) {
          console.log('✅ WebGL is supported');
          console.log('WebGL Version:', gl.getParameter(gl.VERSION));
          console.log('WebGL Vendor:', gl.getParameter(gl.VENDOR));
          console.log('WebGL Renderer:', gl.getParameter(gl.RENDERER));
        } else {
          console.error('❌ WebGL is NOT supported on this device/browser');
          console.log('This could be due to:');
          console.log('- Outdated graphics drivers');
          console.log('- Hardware acceleration disabled');
          console.log('- Browser security settings');
          console.log('- Incompatible browser version');
        }
        
        // Check WebGL2 support
        const gl2 = canvas.getContext('webgl2');
        if (gl2) {
          console.log('✅ WebGL2 is supported');
        } else {
          console.log('⚠️ WebGL2 is not supported (falling back to WebGL1)');
        }
        
        // Check if we're on HTTPS
        console.log('Protocol:', window.location.protocol);
        if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
          console.warn('⚠️ AR features require HTTPS in production');
        }
      }
      
      function getBrowserName() {
        const userAgent = navigator.userAgent;
        if (userAgent.includes('Chrome')) return 'Chrome';
        if (userAgent.includes('Firefox')) return 'Firefox';
        if (userAgent.includes('Safari')) return 'Safari';
        if (userAgent.includes('Edge')) return 'Edge';
        return 'Unknown';
      }
      
      // Debug MindAR initialization
      window.addEventListener('load', () => {
        checkWebGLSupport();
        console.log('Page loaded, checking MindAR setup...');
        
        setTimeout(() => {
          const sceneEl = document.querySelector('a-scene');
          if (sceneEl) {
            console.log('A-Scene found:', sceneEl);
            console.log('MindAR attributes:', sceneEl.getAttribute('mindar-image'));
            
            // Check if MindAR system exists
            const arSystem = sceneEl.systems['mindar-image-system'];
            if (arSystem) {
              console.log('MindAR system found:', arSystem);
              console.log('MindAR system state:', arSystem.el.sceneEl.isPlaying);
            } else {
              console.error('MindAR system not found!');
            }
            
            // Check for target elements
            const targets = document.querySelectorAll('[mindar-image-target]');
            console.log('Found target elements:', targets.length);
            targets.forEach((target, index) => {
              console.log(`Target ${index}:`, target.id, target.getAttribute('mindar-image-target'));
            });
            
            // Check for model elements
            const models = document.querySelectorAll('a-gltf-model');
            console.log('Found model elements:', models.length);
            models.forEach((model, index) => {
              console.log(`Model ${index}:`, model.id, model.getAttribute('src'));
            });
          } else {
            console.error('A-Scene not found!');
          }
        }, 2000);

        // Add global target event listeners for buttons
        setTimeout(() => {
          const sceneEl = document.querySelector('a-scene');
          if (sceneEl) {
            sceneEl.addEventListener('targetFound', () => {
              console.log('🎯 Target found - showing buttons');
              showContactButtons();
            });

            sceneEl.addEventListener('targetLost', () => {
              console.log('❌ Target lost - hiding buttons');
              hideContactButtons();
            });

            // Also add listeners to specific target elements
            const cardFront = document.getElementById('card-front');
            if (cardFront) {
              cardFront.addEventListener('targetFound', () => {
                console.log('🎯 Card-front target found - showing buttons');
                showContactButtons();
              });

              cardFront.addEventListener('targetLost', () => {
                console.log('❌ Card-front target lost - hiding buttons');
                hideContactButtons();
              });
            }
          }
        }, 3000);

        // Check if buttons element exists
        setTimeout(() => {
          const buttons = document.getElementById('contact-buttons');
          console.log('Buttons element check:', buttons);
          if (buttons) {
            console.log('✅ Buttons element found in DOM');
          } else {
            console.error('❌ Buttons element NOT found in DOM');
          }
        }, 1000);
      });

      // Contact button functions
      function openWebsite() {
        window.open('https://quinxiedoan.xyz/', '_blank');
      }

      function openLinkedIn() {
        window.open('https://www.linkedin.com/in/quyendoan51/', '_blank');
      }

      function openEmail() {
        window.location.href = 'mailto:quyenthucdoan51@gmail.com';
      }

      // Show buttons when target is found and make them follow the card
      function showContactButtons() {
        const buttons = document.getElementById('contact-buttons');
        if (buttons) {
          buttons.style.display = 'flex';
          buttons.style.position = 'fixed';
          buttons.style.zIndex = '1000';
          buttons.style.animation = 'fadeInUp 0.6s ease-out';
          console.log('2D contact buttons are now visible');
          
          // Start tracking the AR card position
          startTrackingCardPosition();
        } else {
          console.error('Contact buttons element not found!');
        }
      }
      
      // Function to track AR card position and update button position
      function startTrackingCardPosition() {
        const scene = document.querySelector('a-scene');
        const buttons = document.getElementById('contact-buttons');
        
        function updateButtonPosition() {
          // Get the AR target entity
          const cardFront = document.querySelector('#card-front');
          if (cardFront && buttons && buttons.style.display !== 'none') {
            // Get the object3D position
            const object3D = cardFront.object3D;
            if (object3D) {
              // Convert 3D position to screen coordinates
              const camera = scene.camera;
              const vector = new THREE.Vector3();
              
              // Get world position
              object3D.getWorldPosition(vector);
              
              // Project to screen coordinates
              vector.project(camera);
              
              // Convert to screen pixels
              const widthHalf = window.innerWidth / 2;
              const heightHalf = window.innerHeight / 2;
              
              const x = (vector.x * widthHalf) + widthHalf;
              const y = -(vector.y * heightHalf) + heightHalf;
              
              // Position buttons directly below the tracked image
              // Calculate the bottom edge of the image and place buttons below it
              const imageHeight = 200; // Approximate height of the tracked image in pixels
              const buttonOffset = 20; // Small gap between image and buttons
              
              buttons.style.left = x + 'px';
              buttons.style.top = (y + (imageHeight / 2) + buttonOffset) + 'px';
              buttons.style.transform = 'translateX(-50%)';
              buttons.style.bottom = 'auto';
              
              // Only show buttons if the image is visible on screen
              if (vector.z < 1 && vector.x >= -1 && vector.x <= 1 && vector.y >= -1 && vector.y <= 1) {
                buttons.style.display = 'flex';
              } else {
                buttons.style.display = 'none';
              }
            }
          }
        }
        
        // Update button position every frame for smooth tracking
        const trackingInterval = setInterval(updateButtonPosition, 50); // Increased frequency for smoother tracking
        
        // Store interval ID for cleanup
        window.buttonTrackingInterval = trackingInterval;
      }

      // Hide buttons when target is lost
      function hideContactButtons() {
        const buttons = document.getElementById('contact-buttons');
        if (buttons) {
          buttons.style.display = 'none';
          console.log('2D contact buttons hidden');
          
          // Stop tracking the AR card position
          if (window.buttonTrackingInterval) {
            clearInterval(window.buttonTrackingInterval);
            window.buttonTrackingInterval = null;
          }
        }
      }

      // Test function to manually show buttons (for debugging)
      function testButtons() {
        console.log('Testing 2D button visibility...');
        const buttons = document.getElementById('contact-buttons');
        
        console.log('2D Button container:', buttons);
        
        if (buttons) {
          console.log('✅ 2D button container found');
          showContactButtons();
        } else {
          console.error('❌ 2D button container not found');
        }
      }

      // Make test function globally available
      window.testButtons = testButtons;
      window.showButtons = showContactButtons;
      window.hideButtons = hideContactButtons;
    </script>
    <style>
      /* Add this inside your head section */
      .clickable {
        cursor: pointer;
      }
      .clickable:hover {
        transform: scale(1.1);
      }

      /* Import Poppins font */
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

      /* Button container */
      .buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        margin-top: 20px;
        padding: 0;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
      }

      /* Website Button */
      button.website {
        background: transparent;
        border: 1.5px solid white;
        color: white;
        padding: 10px 24px;
        border-radius: 30px;
        font-family: 'Montserrat', sans-serif !important;
        font-weight: 500;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        cursor: pointer;
        font-size: 14px;
      }

      button.website:hover {
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      /* LinkedIn Button */
      button.linkedin {
        background: linear-gradient(90deg, #6BA3E8, #1C4CA3);
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 30px;
        font-family: 'Montserrat', sans-serif !important;
        font-weight: 500;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
        font-size: 14px;
      }

      button.linkedin:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 12px rgba(173, 216, 255, 0.5);
      }

      /* Email Button */
      button.email {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid white;
        color: white;
        padding: 10px 24px;
        border-radius: 30px;
        font-family: 'Montserrat', sans-serif !important;
        font-weight: 500;
        letter-spacing: 0.5px;
        transition: background 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
        font-size: 14px;
      }

      button.email:hover {
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      /* Animation for button appearance */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Responsive design */
      @media (max-width: 768px) {
        .buttons {
          flex-direction: row;
          gap: 8px;
          padding: 0;
        }
        
        button.website,
        button.linkedin,
        button.email {
          padding: 8px 16px;
          font-size: 12px;
        }
      }
      
      /* Debug panel styles */
      #debug-panel {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px;
        border-radius: 5px;
        max-width: 80%;
        max-height: 200px;
        overflow-y: auto;
        z-index: 9999;
        font-size: 12px;
      }
      #debug-panel button {
        background: #4CAF50;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 3px;
        margin-bottom: 5px;
      }
      #audio-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.85);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        font-size: 1.5em;
      }
      #audio-overlay button {
        margin-top: 24px;
        font-size: 1.2em;
        padding: 16px 32px;
        border: none;
        border-radius: 8px;
        background: #4CAF50;
        color: #fff;
        cursor: pointer;
      }
    </style>
     <script>
       // Audio control component
       AFRAME.registerComponent('audio-controller', {
         init: function() {
           this.el.addEventListener('targetFound', () => {
             // Show contact buttons when target is found
             showContactButtons();
             
             // Play video when target is found
             const arVideo = document.getElementById('ar-video');
             const promoVideo = document.getElementById('promo-video');
             if (arVideo && promoVideo) {
               // Make sure video is visible
               arVideo.setAttribute('visible', true);
               arVideo.setAttribute('opacity', 1);
               // Play the video element
               if (promoVideo instanceof HTMLVideoElement) {
                 promoVideo.play().catch(err => console.log('Video play error:', err));
                 console.log('Video playback started');
               }
             }
           });

           this.el.addEventListener('targetLost', () => {
             // Hide contact buttons when target is lost
             hideContactButtons();
             
             // Pause video when target is lost
             const promoVideo = document.getElementById('promo-video');
             if (promoVideo && promoVideo instanceof HTMLVideoElement) {
               promoVideo.pause();
               console.log('Video playback paused');
             }
           });
         }
       });
     </script>
    <title>Business Card</title>
  </head>
  <body>
    <div id="ar-display">
      <!-- Real video that gets displayed on screen.
       This canvas forwards MindAR's video stream from a static <video> element that is dynamically controlled by MindAR. -->
      <canvas id="video-canvas"></canvas>
      <!-- If we only use the original a-canvas from MindAR,
        we will not be able to control the rendering logic of the 3D models attached to the scene.
        Here, whatever being rendered on ar-effect-canvas will overlay on top of the MindAR effects.
        With this, we can achieve the transition from an image-tracked object to a freely-floating object.-->
      <canvas id="ar-effect-canvas"></canvas>
    </div>
    <div id="ar-scene">
      <!-- Add note that all relative paths inside this document has the root folder as the public/ folder inside code_source/ -->

      <!--  We no longer use DRACO in our a-scene due to the
        lagging of rendering transparency and real-time tracking.
        We can reduce faces in our models, which is effective enough to remove DRACO.
        gltf-model="dracoDecoderPath: /draco/" -->

      <!-- This a-scene is the core of MindAR image tracking effects. MindAR inherently uses a merge of three.js and A-Frame.
       It tracks the image targets encoded inside ./targets.mind
       To compile the .mind files, use this tool here: https://hiukim.github.io/mind-ar-js-doc/tools/compile
       This tool supports tracking of multiple images at the same time. To do that, upload multiple images at the same time and get a large
       compiled .mind file as the target. Notice that the "mindar-image-target" treats targetIndex as the sequence in which you uploaded the targets.  -->
      <!-- If you want to delay the start of MindAR, you can add "autoStart: false;" to the  mindar-image attribute, and you need to
       manually call document.querySelector('a-scene').systems['mindar-image-system'].start(); -->
      <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; uiLoading:no; uiScanning:no; maxTrack: 2; uiError:no;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        xrextras-runtime-error
        xrextras-gesture-detector
        renderer="colorManagement:true; webgl2: false; antialias: false;"
        xrweb="disableWorldTracking: false"
        renderer-provider
      >
        <!-- Add lighting -->
        <a-light type="ambient" intensity="1"></a-light>
        <a-light type="directional" intensity="0.6" position="1 1 1"></a-light>
        <!-- There will be an <canvas class="a-canvas"> element being generated as this level once the MindAR engine starts.
          We name this canvas element as "MindAR Canvas", which is also the canvas used by this a-scene.
          Note that -->
        <a-assets>
          <!-- Here, you put the model resources that you are going to use later in the scene.
           All later usage in the scene will be reference to these assets-->
          <a-asset-item
            id="custom-model"
            src="/models/scene/animated_butterfly/scene.gltf"
            onload="console.log('Model loaded successfully')"
            onerror="console.error('Error loading model:', event)"
          ></a-asset-item>
          <img id="linkedin-icon" src="/images/linkedin.png" />
          <img id="email-icon" src="/images/gmail.png" />
          <img id="portfolio-icon" src="/images/portfolio.png" />
          
          <!-- Video asset for AR tracking -->
          <video
            id="promo-video"
            src="./public/videos/0km.mp4"
            autoplay="true"
            loop="true"
            muted="true"
            playsinline="true"
            preload="auto"
            onload="console.log('Video loaded successfully')"
            onerror="console.log('Video file not found - this is optional. Place your video in /videos/0km.mp4')"
          ></video>
          
          <!-- You can also add files by yourself. You don't have to provide a link. Just remember to put it in the code_source/public folder.-->
          <!-- <a-asset-item
            id="placeholder"
            src="/custom_card_assets/PLACEHOLDER"
          ></a-asset-item> -->
        </a-assets>
        <!-- This is the camera used by MindAR to render content within this scene. -->
        <a-camera
          id="camera"
          position="0 0 0"
          look-controls="enabled: false"
          cursor="fuse: false; rayOrigin: mouse;"
          raycaster="far: 10000; objects: .clickable"
        ></a-camera>
        <!-- This scene also gets automatically rendered in the canvas. However, it is out of MindAR's binding to image targets.
         If needed, we can render it to our custom canvas scene.-->
        <a-entity
          id="free-scene"
          position="0 0 0"
          rotation="0 0 0"
          free-scene-render
        >
          <a-entity id="card-back-moveable-root" position="0 0 -6">
            <!-- At the beginning, we disable the visibility of this model.
             In the code, if we want to render the transition from an image-tracked object to a freely-floating object,
             we make the tracked model in the "card-front" <a-entity> element below invisible and make this object visible,
              while applying the same transform onto this object, achieving the fluent transition from a tracked objet to a free object.-->
            <a-gltf-model
              src="#custom-model"
              position="0 0.5 0.1"
              rotation="0 0 0"
              scale="0.15 0.15 0.15"
              shadow
              id="mind-ar-model"
              animation-mixer="clip: *; loop: repeat; timeScale: 1"
              animation__float="property: position; dur: 2000; dir: alternate; easing: easeInOutQuad; loop: true; from: 0 0.5 0; to: 0 0.7 0"
              visible="false"
              onload="console.log('3D Model loaded successfully'); this.setAttribute('animation-mixer', {clip: '*', loop: 'repeat', timeScale: 1});"
              onerror="console.error('Error loading 3D model:', this.error)"
            ></a-gltf-model>
            <!-- <a-light
              id="ambient-light"
              type="ambient"
              color="yellow"
              intensity="0.5"
              position="0 0 0"
            /> -->
          </a-entity>
        </a-entity>
        <a-entity
          id="card-front"
          mindar-image-target="targetIndex: 0"
          animation-controller="component: card-front;"
          audio-controller
        >
          <!-- <a-light
            type="point"
            color="yellow"
            intensity="10.0"
            position="0 0 0.8"
          ></a-light> -->
          <a-entity id="card-front-moveable-root">
            <!-- Container for model and icons that will float together -->
             <a-entity
               id="floating-container"
               position="0 0.5 0.1"
               animation__float="property: position; dur: 2000; dir: alternate; easing: easeInOutQuad; loop: true; from: 0 0.5 0; to: 0 0.7 0"
             >
               <!-- 3D Model -->
             <a-gltf-model
                 src="#custom-model"
                 position="0 0 0.02"
                 rotation="0 0 0"
                 scale="0.15 0.15 0.15"
                 shadow
                 id="mind-ar-model"
                 animation-mixer="clip: *; loop: repeat; timeScale: 1"
                 onload="console.log('3D Model loaded successfully'); this.setAttribute('animation-mixer', {clip: '*', loop: 'repeat', timeScale: 1});"
                 onerror="console.error('Error loading 3D model:', this.error)"
             ></a-gltf-model>

               <!-- Video element for AR tracking -->
               <a-video
                 src="#promo-video"
                 position="-0.1 -0.1 -0.1"
                 width="1.2"
                 height="0.8"
                 rotation="-90 0 0"
                 visible="true"
                 id="ar-video"
                 opacity="1"
                 onload="console.log('AR Video loaded successfully')"
                 onerror="console.error('Error loading AR video:', this.error)"
               ></a-video>

               <!-- 2D buttons will be positioned via JavaScript to follow the card -->

               <!-- Circular path for icons -->
               <a-entity
                 id="icon-orbit"
                 animation__rotate="property: rotation; dur: 30000; loop: true; to: 0 360 0; easing: linear"
               ></a-entity>
             </a-entity>
          </a-entity>
        </a-entity>
        <!-- MindAR supports image tracking of different images at the same time.
         Just upload the two images in the same sequence as the index here on the online tool. -->
        <a-entity
          id="card-back"
          mindar-image-target="targetIndex: 1"
          animation-controller="component: card-back;"
        >
        </a-entity>
      </a-scene>
    </div>
    <div id="ui-display">
      <!-- Add any of your customized UIs. Note that this will cover the original scene.-->
    </div>

    <!-- 2D Contact Buttons that follow the AR card -->
    <div class="buttons" id="contact-buttons" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;">
      <button class="email" onclick="openEmail()">Email</button>
      <button class="linkedin" onclick="openLinkedIn()">LinkedIn</button>
      <button class="website" onclick="openWebsite()">Portfolio</button>
    </div>

  </body>
</html>
