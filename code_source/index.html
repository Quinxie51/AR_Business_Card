    <!-- Debug script to help troubleshoot AR issues -->
    <script>
      // WebGL Detection and Browser Info
      function checkWebGLSupport() {
        console.log('=== WebGL & Browser Compatibility Check ===');
        console.log('User Agent:', navigator.userAgent);
        console.log('Browser:', getBrowserName());
        
        // Check WebGL support
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        
        if (gl) {
          console.log('✅ WebGL is supported');
          console.log('WebGL Version:', gl.getParameter(gl.VERSION));
          console.log('WebGL Vendor:', gl.getParameter(gl.VENDOR));
          console.log('WebGL Renderer:', gl.getParameter(gl.RENDERER));
        } else {
          console.error('❌ WebGL is NOT supported on this device/browser');
          console.log('This could be due to:');
          console.log('- Outdated graphics drivers');
          console.log('- Hardware acceleration disabled');
          console.log('- Browser security settings');
          console.log('- Incompatible browser version');
        }
        
        // Check WebGL2 support
        const gl2 = canvas.getContext('webgl2');
        if (gl2) {
          console.log('✅ WebGL2 is supported');
        } else {
          console.log('⚠️ WebGL2 is not supported (falling back to WebGL1)');
        }
        
        // Check if we're on HTTPS
        console.log('Protocol:', window.location.protocol);
        if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
          console.warn('⚠️ AR features require HTTPS in production');
        }
      }
      
      function getBrowserName() {
        const userAgent = navigator.userAgent;
        if (userAgent.includes('Chrome')) return 'Chrome';
        if (userAgent.includes('Firefox')) return 'Firefox';
        if (userAgent.includes('Safari')) return 'Safari';
        if (userAgent.includes('Edge')) return 'Edge';
        return 'Unknown';
      }
      
      // Debug MindAR initialization
      window.addEventListener('load', () => {
        checkWebGLSupport();
        console.log('Page loaded, checking MindAR setup...');
        
        setTimeout(() => {
          const sceneEl = document.querySelector('a-scene');
          if (sceneEl) {
            console.log('A-Scene found:', sceneEl);
            console.log('MindAR attributes:', sceneEl.getAttribute('mindar-image'));
            
            // Check if MindAR system exists
            const arSystem = sceneEl.systems['mindar-image-system'];
            if (arSystem) {
              console.log('MindAR system found:', arSystem);
              console.log('MindAR system state:', arSystem.el.sceneEl.isPlaying);
            } else {
              console.error('MindAR system not found!');
            }
            
            // Check for target elements
            const targets = document.querySelectorAll('[mindar-image-target]');
            console.log('Found target elements:', targets.length);
            targets.forEach((target, index) => {
              console.log(`Target ${index}:`, target.id, target.getAttribute('mindar-image-target'));
            });
            
            // Check for model elements
            const models = document.querySelectorAll('a-gltf-model');
            console.log('Found model elements:', models.length);
            models.forEach((model, index) => {
              console.log(`Model ${index}:`, model.id, model.getAttribute('src'));
            });
          } else {
            console.error('A-Scene not found!');
          }
        }, 2000);

        // Add global target event listeners for buttons
        setTimeout(() => {
          const sceneEl = document.querySelector('a-scene');
          if (sceneEl) {
            sceneEl.addEventListener('targetFound', () => {
              console.log('🎯 Target found - showing buttons');
              showContactButtons();
            });

            sceneEl.addEventListener('targetLost', () => {
              console.log('❌ Target lost - hiding buttons');
              hideContactButtons();
            });

            // Also add listeners to specific target elements
            const cardFront = document.getElementById('card-front');
            if (cardFront) {
              cardFront.addEventListener('targetFound', () => {
                console.log('🎯 Card-front target found - showing buttons');
                showContactButtons();
              });

              cardFront.addEventListener('targetLost', () => {
                console.log('❌ Card-front target lost - hiding buttons');
                hideContactButtons();
              });
            }
          }
        }, 3000);

        // Check if buttons element exists
        setTimeout(() => {
          const buttons = document.getElementById('contact-buttons');
          console.log('Buttons element check:', buttons);
          if (buttons) {
            console.log('✅ Buttons element found in DOM');
          } else {
            console.error('❌ Buttons element NOT found in DOM');
          }
        }, 1000);
      });

      // Contact button functions
      function openWebsite() {
        window.open('https://quinxie51.github.io/Portfolio/', '_blank');
      }

      function openLinkedIn() {
        window.open('https://www.linkedin.com/in/quyen-hoang-2bb5a4179/', '_blank');
      }

      function openEmail() {
        window.location.href = 'mailto:quyenhoang5197@gmail.com';
      }

      // Show buttons when target is found (3D buttons are now part of the AR scene)
      function showContactButtons() {
        console.log('3D buttons are now integrated into the AR scene and will appear automatically');
        // The 3D buttons are now part of the AR scene and will appear when the target is detected
      }

      // Hide buttons when target is lost (3D buttons will disappear automatically)
      function hideContactButtons() {
        console.log('3D buttons will disappear automatically when target is lost');
        // The 3D buttons are now part of the AR scene and will disappear when the target is lost
      }

      // Test function to manually show buttons (for debugging)
      function testButtons() {
        console.log('Testing 3D button visibility...');
        const websiteButton = document.getElementById('website-button');
        const linkedinButton = document.getElementById('linkedin-button');
        const emailButton = document.getElementById('email-button');
        
        console.log('3D Button elements:', {
          website: websiteButton,
          linkedin: linkedinButton,
          email: emailButton
        });
        
        if (websiteButton && linkedinButton && emailButton) {
          console.log('✅ All 3D buttons found in AR scene');
        } else {
          console.error('❌ Some 3D buttons not found in AR scene');
        }
      }

      // Make test function globally available
      window.testButtons = testButtons;
      window.showButtons = showContactButtons;
      window.hideButtons = hideContactButtons;
    </script>
    <style>
      /* Add this inside your head section */
      .clickable {
        cursor: pointer;
      }
      .clickable:hover {
        transform: scale(1.1);
      }

      /* Import Poppins font */
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

      /* Button container */
      .buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        margin-top: 20px;
        padding: 0;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
      }

      /* Website Button */
      button.website {
        background: transparent;
        border: 1.5px solid white;
        color: white;
        padding: 10px 24px;
        border-radius: 30px;
        font-family: 'Poppins', sans-serif;
        font-weight: 500;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        cursor: pointer;
        font-size: 14px;
      }

      button.website:hover {
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      /* LinkedIn Button */
      button.linkedin {
        background: linear-gradient(90deg, #6BA3E8, #1C4CA3);
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 30px;
        font-family: 'Poppins', sans-serif;
        font-weight: 500;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
        font-size: 14px;
      }

      button.linkedin:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 12px rgba(173, 216, 255, 0.5);
      }

      /* Email Button */
      button.email {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid white;
        color: white;
        padding: 10px 24px;
        border-radius: 30px;
        font-family: 'Poppins', sans-serif;
        font-weight: 500;
        letter-spacing: 0.5px;
        transition: background 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
        font-size: 14px;
      }

      button.email:hover {
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      /* Animation for button appearance */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Responsive design */
      @media (max-width: 768px) {
        .buttons {
          flex-direction: row;
          gap: 8px;
          padding: 0;
        }
        
        button.website,
        button.linkedin,
        button.email {
          padding: 8px 16px;
          font-size: 12px;
        }
      }
      
      /* Debug panel styles */
      #debug-panel {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px;
        border-radius: 5px;
        max-width: 80%;
        max-height: 200px;
        overflow-y: auto;
        z-index: 9999;
        font-size: 12px;
      }
      #debug-panel button {
        background: #4CAF50;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 3px;
        margin-bottom: 5px;
      }
      #audio-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.85);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        font-size: 1.5em;
      }
      #audio-overlay button {
        margin-top: 24px;
        font-size: 1.2em;
        padding: 16px 32px;
        border: none;
        border-radius: 8px;
        background: #4CAF50;
        color: #fff;
        cursor: pointer;
      }
    </style>
    <script>
      let bgMusic;
      let hasInteracted = false;

      // Show overlay on load
      window.addEventListener('DOMContentLoaded', () => {
        const overlay = document.getElementById('audio-overlay');
        overlay.style.display = 'flex';
      });

      function enableAudioFromOverlay() {
        hasInteracted = true;
        if (bgMusic && !bgMusic.playing()) {
          bgMusic.play();
        }
        document.getElementById('audio-overlay').style.display = 'none';
      }

      // Initialize background music
      function initializeAudio() {
        bgMusic = new Howl({
          src: ['/audio/background-music.mp3'],
          loop: true,
          volume: 0.5,
          autoplay: false,
          html5: true,
        });
      }

      // Audio control component
      AFRAME.registerComponent('audio-controller', {
        init: function() {
          initializeAudio();

          this.el.addEventListener('targetFound', () => {
            if (bgMusic && !bgMusic.playing() && hasInteracted) {
              bgMusic.play();
            }
            // Show contact buttons when target is found
            showContactButtons();
          });

          this.el.addEventListener('targetLost', () => {
            // Hide contact buttons when target is lost
            hideContactButtons();
          });
        }
      });

      function toggleMusic() {
        if (!bgMusic) {
          return;
        }
        const button = document.querySelector('#audio-controls button');
        if (bgMusic.playing()) {
          bgMusic.fade(0.5, 0, 500);
          setTimeout(() => bgMusic.pause(), 500);
          button.textContent = '🔈';
        } else {
          bgMusic.fade(0, 0.5, 500);
          bgMusic.play();
          button.textContent = '🔊';
        }
      }
    </script>
    <title>Business Card</title>

  <body>
    <div id="ar-display">
      <!-- Add audio controls -->
      <div id="audio-controls" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
        <button onclick="toggleMusic()" style="padding: 10px; border-radius: 50%; background: rgba(255,255,255,0.7); border: none; cursor: pointer;">
          🔊
        </button>
      </div>
      <!-- Real video that gets displayed on screen.
       This canvas forwards MindAR's video stream from a static <video> element that is dynamically controlled by MindAR. -->
      <canvas id="video-canvas"></canvas>
      <!-- If we only use the original a-canvas from MindAR,
        we will not be able to control the rendering logic of the 3D models attached to the scene.
        Here, whatever being rendered on ar-effect-canvas will overlay on top of the MindAR effects.
        With this, we can achieve the transition from an image-tracked object to a freely-floating object.-->
      <canvas id="ar-effect-canvas"></canvas>
    </div>
    <div id="ar-scene">
      <!-- Add note that all relative paths inside this document has the root folder as the public/ folder inside code_source/ -->

      <!--  We no longer use DRACO in our a-scene due to the
        lagging of rendering transparency and real-time tracking.
        We can reduce faces in our models, which is effective enough to remove DRACO.
        gltf-model="dracoDecoderPath: /draco/" -->

      <!-- This a-scene is the core of MindAR image tracking effects. MindAR inherently uses a merge of three.js and A-Frame.
       It tracks the image targets encoded inside ./targets.mind
       To compile the .mind files, use this tool here: https://hiukim.github.io/mind-ar-js-doc/tools/compile
       This tool supports tracking of multiple images at the same time. To do that, upload multiple images at the same time and get a large
       compiled .mind file as the target. Notice that the "mindar-image-target" treats targetIndex as the sequence in which you uploaded the targets.  -->
      <!-- If you want to delay the start of MindAR, you can add "autoStart: false;" to the  mindar-image attribute, and you need to
       manually call document.querySelector('a-scene').systems['mindar-image-system'].start(); -->
      <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; uiLoading:no; uiScanning:no; maxTrack: 2; uiError:no;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        xrextras-runtime-error
        xrextras-gesture-detector
        renderer="colorManagement:true; webgl2: false; antialias: false;"
        xrweb="disableWorldTracking: false"
        renderer-provider
      >
        <!-- Add lighting -->
        <a-light type="ambient" intensity="1"></a-light>
        <a-light type="directional" intensity="0.6" position="1 1 1"></a-light>
        <!-- There will be an <canvas class="a-canvas"> element being generated as this level once the MindAR engine starts.
          We name this canvas element as "MindAR Canvas", which is also the canvas used by this a-scene.
          Note that -->
        <a-assets>
          <!-- Here, you put the model resources that you are going to use later in the scene.
           All later usage in the scene will be reference to these assets-->
          <a-asset-item
            id="custom-model"
            src="/models/scene/animated_butterfly/scene.gltf"
            onload="console.log('Model loaded successfully')"
            onerror="console.error('Error loading model:', event)"
          ></a-asset-item>
          <img id="linkedin-icon" src="/images/linkedin.png" />
          <img id="email-icon" src="/images/gmail.png" />
          <img id="portfolio-icon" src="/images/portfolio.png" />
          <!-- You can also add files by yourself. You don't have to provide a link. Just remember to put it in the code_source/public folder.-->
          <!-- <a-asset-item
            id="placeholder"
            src="/custom_card_assets/PLACEHOLDER"
          ></a-asset-item> -->
        </a-assets>
        <!-- This is the camera used by MindAR to render content within this scene. -->
        <a-camera
          id="camera"
          position="0 0 0"
          look-controls="enabled: false"
          cursor="fuse: false; rayOrigin: mouse;"
          raycaster="far: 10000; objects: .clickable"
        ></a-camera>
        <!-- This scene also gets automatically rendered in the canvas. However, it is out of MindAR's binding to image targets.
         If needed, we can render it to our custom canvas scene.-->
        <a-entity
          id="free-scene"
          position="0 0 0"
          rotation="0 0 0"
          free-scene-render
        >
          <a-entity id="card-back-moveable-root" position="0 0 -6">
            <!-- At the beginning, we disable the visibility of this model.
             In the code, if we want to render the transition from an image-tracked object to a freely-floating object,
             we make the tracked model in the "card-front" <a-entity> element below invisible and make this object visible,
              while applying the same transform onto this object, achieving the fluent transition from a tracked objet to a free object.-->
            <a-gltf-model
              src="#custom-model"
              position="0 0.5 0.1"
              rotation="0 0 0"
              scale="0.15 0.15 0.15"
              shadow
              id="mind-ar-model"
              animation-mixer="clip: *; loop: repeat; timeScale: 1"
              animation__float="property: position; dur: 2000; dir: alternate; easing: easeInOutQuad; loop: true; from: 0 0.5 0; to: 0 0.7 0"
              visible="false"
              onload="console.log('3D Model loaded successfully'); this.setAttribute('animation-mixer', {clip: '*', loop: 'repeat', timeScale: 1});"
              onerror="console.error('Error loading 3D model:', this.error)"
            ></a-gltf-model>
            <!-- <a-light
              id="ambient-light"
              type="ambient"
              color="yellow"
              intensity="0.5"
              position="0 0 0"
            /> -->
          </a-entity>
        </a-entity>
        <a-entity
          id="card-front"
          mindar-image-target="targetIndex: 0"
          animation-controller="component: card-front;"
          audio-controller
        >
          <!-- <a-light
            type="point"
            color="yellow"
            intensity="10.0"
            position="0 0 0.8"
          ></a-light> -->
          <a-entity id="card-front-moveable-root">
            <!-- Container for model and icons that will float together -->
            <a-entity
              id="floating-container"
              position="0 0.5 0.1"
              animation__float="property: position; dur: 2000; dir: alternate; easing: easeInOutQuad; loop: true; from: 0 0.5 0; to: 0 0.7 0"
            >
              <!-- 3D Model -->
            <a-gltf-model
                src="#custom-model"
                position="0 0 0.1"
                rotation="0 0 0"
                scale="0.15 0.15 0.15"
                shadow
                id="mind-ar-model"
                animation-mixer="clip: *; loop: repeat; timeScale: 1"
                onload="console.log('3D Model loaded successfully'); this.setAttribute('animation-mixer', {clip: '*', loop: 'repeat', timeScale: 1});"
                onerror="console.error('Error loading 3D model:', this.error)"
            ></a-gltf-model>

              <!-- Contact Buttons positioned at bottom of card -->
              <!-- Website Button -->
              <a-plane
                id="website-button"
                position="-0.4 -0.6 0"
                width="0.5"
                height="0.08"
                color="#ffffff"
                opacity="0.9"
                material="transparent: true; opacity: 0.9"
                class="clickable"
                clickable
                link-type="url"
                link-url="https://quinxie51.github.io/Portfolio/"
              >
                <a-text
                  value="Portfolio"
                  position="0 0 0.01"
                  align="center"
                  color="#000000"
                  font="dejavu"
                  width="4"
                ></a-text>
              </a-plane>

              <!-- LinkedIn Button -->
              <a-plane
                id="linkedin-button"
                position="0 -0.6 0"
                width="0.5"
                height="0.08"
                color="#0077b5"
                opacity="0.9"
                material="transparent: true; opacity: 0.9"
                class="clickable"
                clickable
                link-type="url"
                link-url="https://www.linkedin.com/in/quyen-hoang-2bb5a4179/"
              >
                <a-text
                  value="LinkedIn"
                  position="0 0 0.01"
                  align="center"
                  color="#ffffff"
                  font="dejavu"
                  width="4"
                ></a-text>
              </a-plane>

              <!-- Email Button -->
              <a-plane
                id="email-button"
                position="0.4 -0.6 0"
                width="0.5"
                height="0.08"
                color="#ffffff"
                opacity="0.9"
                material="transparent: true; opacity: 0.9"
                class="clickable"
                clickable
                link-type="email"
                link-url="mailto:quyenhoang5197@gmail.com"
              >
                <a-text
                  value="Email"
                  position="0 0 0.01"
                  align="center"
                  color="#000000"
                  font="dejavu"
                  width="4"
                ></a-text>
              </a-plane>

              <!-- Circular path for icons -->
              <a-entity
                id="icon-orbit"
                animation__rotate="property: rotation; dur: 30000; loop: true; to: 0 360 0; easing: linear"
              ></a-entity>
            </a-entity>
          </a-entity>
        </a-entity>
        <!-- MindAR supports image tracking of different images at the same time.
         Just upload the two images in the same sequence as the index here on the online tool. -->
        <a-entity
          id="card-back"
          mindar-image-target="targetIndex: 1"
          animation-controller="component: card-back;"
        >
        </a-entity>
      </a-scene>
    </div>
    <div id="ui-display">
      <!-- Add any of your customized UIs. Note that this will cover the original scene.-->
    </div>
    <!-- Audio overlay for mobile user interaction -->
    <div id="audio-overlay" style="display:none;">
      <div>Tap to enable audio</div>
      <button onclick="enableAudioFromOverlay()">Enable Audio</button>
    </div>

    <!-- 3D buttons are now integrated into the AR scene -->

    <!-- Test Button (for debugging) -->
    <button onclick="testButtons()" style="position: fixed; top: 10px; left: 10px; z-index: 1000; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
      Test Buttons
    </button>

    <!-- Simple Test Button (always visible) -->
    <button onclick="alert('Test button works!')" style="position: fixed; top: 10px; right: 10px; z-index: 1000; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
      Simple Test
    </button>
  </body>
